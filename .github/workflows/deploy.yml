name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # npm ci 偶发网络抖动：外层重试4次 + npm 网络超时，避免单次失败拖垮部署
        run: |
          for attempt in 1 2 3 4; do
            echo "--- npm ci 尝试 $attempt/4 ---"
            if npm ci --fetch-timeout=180000 --fetch-retries=3; then
              echo "npm ci 成功"
              exit 0
            fi
            echo "npm ci 第 $attempt 次失败"
            if [ "$attempt" -lt 4 ]; then
              echo "30 秒后重试..."
              sleep 30
            fi
          done
          echo "npm ci 连续 4 次失败，部署中止"
          exit 1

      - name: Build site
        run: npx hexo clean && npx hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
